<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=ulㅕㅣ, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            list-style: none; /* 문자 앞 도트 제거 */
            width: 300px;    
        }
        li{
            background-color: #f0f0f0;
            border: 1px solid #dddd; /* #dddddd */
            text-align: center;
        }
        /*
        개발자가 정의하지 않아도, 이미 문서의 구조를 css가 파악하여
        미리 정해 놓은 가상 클래스를 이용하여 요소들을 제어할 수도 있다
        */
        li:first-child{
            background-color: #ffcccc;
            border-color: #ff3333;
        }
        li:last-child{
            background-color: #ccffcc;
            border-color: #33cc33;
        }

        /* 가상 클래스의 존재를 모를 경우 무조건 개발자가 직접 정의해야 함
        .mybg{
            background-color: yellow;
        }
        */

        li:nth-child(3){
            background-color: #cce5ff;
            border-color: #3399ff;
        }

        /* 
        짝수번째 li 요소들을 의미 
        홀수번째 - 2n-1, 2n+1, odd
        */
        li:nth-child(2n){
            background-color: #ffdbcc;
            border-color: #ff8133;
            color: red;
        }
    </style>
</head>
<body>
    <ul>
        <li>첫 번째</li>
        <li class="mybg">두 번째</li>
        <li>세 번째</li>
        <li>네 번째</li>
        <li>다섯 번째</li>
    </ul>
</body>
</html>
