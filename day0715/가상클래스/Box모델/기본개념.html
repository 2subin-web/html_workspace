<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 모든 태그는 기본적으로 투명*/
        #box{
            background-color: red;
            border: 20px solid blue;
            width: 500px; /*너비*/
            height: 500px; /*높이*/
            /*padding이란 박스 안의 콘텐츠와 보더의 너비 의미*/
            padding-left: 100px; /*좌측 경계로부터 떨어짐*/
            padding-top: 50px; /* 위쪽 경계로부터 떨어짐*/
        }
    </style>
</head>
<body>
    <h2>css는 모든 태그 요소를 바라볼 때 Box로 간주한다</h2>

    <div id="box">
        난 div
    </div>
</body>
</html>
