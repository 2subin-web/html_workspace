<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습4</title>
    <style>
        #c{
            width: 1000px;
            height: 500px;
            margin:auto;
          
        }

        #t{
            width: 1000px;
            height: 50px;
            background-color: skyblue;
        }
        #l{
            width: 100px;
            height: 400px;
            background-color: blue;
            float: left;
        }
        #r{
            width: 100px;
            height: 400px;
            background-color: green;
            float: right;
        }
        #b{
            width: 1000px;
            height: 50px;
            background-color: skyblue;
            clear: both;
        }
    </style>
</head>
<body>
    <div id="c">
        <div id="t">상</div>
        <div id="l">좌</div>
        <div id="r">우</div>
        <div id="b">하</div>
    </div>
    
</body>
</html>
