<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습3</title>
    <style>
        #container{
            background-color: black;
            width: 1000px;
            height: 700px;
            margin:auto;
        }
        
        #top{
            background-color: skyblue;
            width: 1000px;
            height: 50px;
        }
        #l1{
            background-color: blue;
            width: 500px;
            height: 300px;
            float: left;
        }
        #l2{
            background-color: rgb(16, 16, 81);
            width: 500px;
            height: 300px;
            float: left;
        }
        #right{
            background-color: green;
            width: 500px;
            height: 600px;
            float:right;
          
        }

        #foot{
            background-color: skyblue;
            width: 1000px;
            height: 50px;
            clear: both;
        }

    </style>
</head>
<body>
    <div id="container">
        <div id="top">탑</div>
        <div id="l1">좌상</div>
        <div id="right">우</div>
        <div id="l2">좌하</div>
        <div id="foot">푸터</div>
    </div>
    
</body>
</html>
