<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 1000px;
            background-color: azure;
        }
        #header{
            width: 1000px;
            height: 50px;
            background-color: aqua;
            float: left;
        }
        #side_up{
            width: 500px;
            height: 300px;
            background-color: rgb(88, 100, 206);
            float: left;
        }
        #side_right{
            width: 500px;
            height: 600px;
            background-color: rgb(41, 192, 15);
            float: right;
        }
        #side_bottom{
            width: 500px;
            height: 300px;
            background-color: rgb(153, 228, 140);
            float: left;
        }
        #footer{
            width:1000px;
            height:50px;
            background:rgb(24, 183, 183);
            clear: both;
        }

    </style>
</head>
<body>
    <div id="container">
        <div id="header"></div>
        <div id="side_up"></div>
        <div id="side_right"></div>
        <div id="side_bottom"></div>
        <div id="footer"></div>
    </div>
</body>
</html>
