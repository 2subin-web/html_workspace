<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 1000px;
            height: 450px;
            background-color: grey;
        }
        #top1{
            width: 1000px;
            height: 50px;
            background-color: aqua;
        }
        #top2{
            width: 1000px;
            height: 50px;
            background-color: rgb(46, 160, 160);
        }
        #leftSide{
            width: 500px;
            height: 300px;
            background-color: rgb(181, 213, 255);
            float: left;
        }        
        #rightSide{
            width: 500px;
            height: 300px;
            background-color: rgb(18, 100, 207);
            float: right;
        }
        #bottom{
            width: 1000px;
            height: 50px;
            background-color: rgb(131, 202, 202);
            float: left;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="top1"></div>
        <div id="top2"></div>
        <div id="leftSide"></div>
        <div id="rightSide"></div>
        <div id="bottom"></div>
    </div>
</body>
</html>
