<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 1000px;
            height: 1000px;
        }
        #top{
            width: 1000px;
            height: 100px;
            background-color: aquamarine;
        }
        #left{
            width: 100px;
            height: 1000px;
            background-color: aqua;
            float: left;
        }
        #right{
            width: 100px;
            height: 1000px;
            background-color: blue;
            float: right;
        }
        #bottom{
            width: 1000px;
            height: 100px;
            background-color: bisque;
            clear: both;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="top"></div>
        <div id="left"></div>
        <div id="right"></div>
        <div id="bottom"></div>
    </div>
</body>
</html>
