<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
<style>
    /*
        HTML에서 이미지와 텍스트를 공존시키면, 서로의 높이 차 때문에
        이미지와 공간이 비어있는 것처럼 보이게 된다.
        이를 해결하기 위해 float를 사용한다.
    */

    img{
        width: 150px;
        float: left;
    }
    /*
    div는 block 형이고, block 속성은 float 되어있는 물체를 볼 수
    없으므로, 이미지의 자리를 파고 들어가버리는 현상..
    단 텍스트는 인라인 속성을 갖는 요소이다.

    주의) 일반적인 텍스트도 html 전체 문서내에서의 요소라 불리고,
          기본적으로 inline 속성을 가지고 있다.

    inline 속성을 갖는 요소는 float 된 요소를 볼 수 있으므로,
    빈자리를 메꾸지 않고 피해간다.
    */

    div{
        width: 300px;
        height: 300px;
        background-color: red;
    }
</style>
</head>

<body>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxxa1J-C4HUotCZnE2WiEcRAX1YbnwT8y3orHtWAfntQ&s=10">
    <div>난 box1</div>

</body>
</html>
</body>
</html>
