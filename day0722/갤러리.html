<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 500px;
            height: 450px;
            background-color: aqua;
            margin:auto;
        }
        .content{
            width: 100%;
            height: 400px;
            background-color: bisque;
       }

       .content img{
            width: 500px;
            height: 400px;
       }
        .control{
            width: 100%;
            height: 50px;
            background-color: pink;
            line-height: 50px;
            text-align: center; /* 수평의 가운데 정렬 */
        }


    </style>
    <script>
        //브라우저가 실행되는 동안 이미지명이 1,2,3,4...10까지 누적이 되어야 하므로
        //되어야 하므로 변수는 전역변수로 선언해야 한다
        let n=1;

        
        function next(){
            //alert("나 눌렀어?");
            //문서내의 내가 목표로 한 이미지의 경로를 바꾸기
            n++;
            if(n>=11){
                n=1;

            }   
            document.getElementById("pic").src="../../images/" + n + ".jpg";
        }

        function prev(){
            n--;
            document.getElementById("pic").src="../../images/" + n + ".jpg";   

        }
        </script>
</head>
<body>

    <div class="container">
        <div class="content">
            <img src="../../images/1.jpg" alt="" id="pic">
        </div>
        <div class="control">
            <button onClick="prev()">이전</button>
            <button onClick="next()">다음</button>
        </div>
    </div>

</body>
</html>
