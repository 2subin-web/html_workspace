<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 500px;
            height: 500px;
            background-color: aqua;
            margin: auto;
        }
        .content{
            width: 500px;
            height: 450px;
            background-color: bisque;
            position: relative; /*자신이 position을 선언했으므로..*/
            overflow: hidden;
    
        
        }
        .footer{
            width: 180%;
            height: 50px;
            background-color: blanchedalmond;
            text-align: center;
            line-height: 50px;
        }

    </style>

    <script>
        //이미지는 규칙이 없다는 전제하에 개발해야 하므로,
        //규칙 없는 이미지를 배열화시켜서 규칙을 만든다!!
        let imgArray = [
                "../images/수빈 이미지/NewJeans A.png",
                "../images/수빈 이미지/NewJeans B.png",
                "../images/수빈 이미지/NewJeans C.png",
                "../images/수빈 이미지/NewJeans D.png"
         ];
        let box; // 모든 함수가 쉽게 접근하도록 하기 위해 전역변수로 빼놓음
        let a=0.1; // 배율 계수값이 커지면 기울기가 커지므로, 투박함..
                    // 즉 보폭이 커져버림..
        let targetX=0; // box가 도달할 x축의 목표지점
        
        function init(){
            //content div 안쪽에 이미지들을 통째로 안고있을 쟁반존재 필요함
            // 필요한 이유? 이미지를 일일이 움직이지 않고, 이 쟁반을 이동시키면
            // 훨씬 효율적이므로...
            let box = document.createElement("div");
            box.style.backgroundColor="pink";
            box.style.position="absolute";  // content div를 부모로 삼아
                                                    // 그 내에서 위치함..
            box.style.left=+"px";
            box.style.width=5000+"px";
            box.style.height=450+"px";
            //content에 자식 요소로 부착
            document.getElementById("content").appendChild(box);

            //생성된 box에 이미지 10개 올려놓기!!
            for(let i=0; i<imgArray.length;i++){
               let img=  document.createElement("img"); // <img>와 같음
                img.src=imgArray[i]; // <img src"">와 같음
                img.style.width=500+"px";
                img.style.height=450+"px";
                img.style.left=i*500+"px"; //500px 간격을 두고 우측으로 배치
                img.style.position="absolute"; // box를 부모로 한 위치 속성 지정
                //생성된 이미지마다 box에 부착해야 하므로, for문 안에서 부착해야 함
                box.appendChild(img);
            }
            
            for(let i=0;i<imgArray.length;i++){

               let bt = document.createElement("div");
                bt.style.width = 30 + "px";
                bt.style.height = 30 + "px";
                bt.style.borderRadius = 50 + "%"; // 모서리 둥글게
                bt.style.backgroundColor = "blue";
                //inline-block 다른 요소와 공존함에 있어서는 inline이고
                //block 특징도 가지고 있어서 width, height 적용가능..

                bt.style.display="inline-block";
                bt.style.margin=3+"px";//서로 떨어지게...
                document.getElementById("footer").appendChild(bt);

                //이벤트 핸들러를 태그 요소에 연결하는 것이 아니라.
                //자바스크립트에서 프로그래밍적으로 연결이 가능하다..
                bt.addEventListener("click",()=>{
                    alert("당신이 선택한 숫자는 ",i);
                    setTarget(i);
                });
            }

            //soft()를 자동으로 호출 ~~
            setInterval("soft()",25);
        }
        
        // 이미지를 안고 있는 box를 이동시키는 함수 정의 
        function next(n){
            box.style.left=-500*n+"px";

        }
        //next() 함수는 box의 left값을 한번에 움직이는 바람에
        //투박하다..따라서 감속도 공식을 이용하여 여러번에 걸쳐 목표지점에
        // 도달하게 하는 함수를 정의하자

        function soft(){
            // 내 위치는 = 현재내위치 + 비율계수 * (목표지점 - 현재내위치)
            box.style.left = parseFloat(box.style.left )+a*(targetX-parseFloat(box.style.left))+"px";
        
        }
        //문서가 로드됨과 동시에 setInterval()에 의해 무조건 실행중임..
        // 따라서 box가 움직이게 하려면, targetX만을 변경하면 된다!!
        //아래의 함수는 targetX 값을 설정하기 위한 함수
        function setTarget(n){
            targetX = -500 * n;
        }


    </script>
</head>

<body onload="init()">

    <div class="container">
        <div class="content" id="content"></div>
        <div class="footer" id="footer"></div>
    </div>

</body>
</html>
