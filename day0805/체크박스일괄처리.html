        function allCheck(){

            // 대표 체크 박스의 상태를 따라하게 하자
            //1) 체크박스의 체크상태를 프로그래밍적으로 제어하는 법
            //      체크박스의 상태를 원하는 상태로 놓기
            //      - checked=true / false 로 놓으면 되고,
            //      체크박스의 상태를 구할때는 king.checked; 로 접근

            //2) 문서내의 다수의 체크박스를 가리키는 방법
            // html 요소에 동일한 name 값을 부여하면, 내부적으로
            // name 값은, 배열명이 된다..

            //현재 ch 라는 name 으로 묶인 요소들로 배열로 받기
            let ch = document.getElementsByName("ch");
            //배열화된 데이터는 반복문의 대상이 될 수 있으므로, 아래의
            // 코드를 노가다 없이 반복문으로 처리해보자.
            for(let i=0;i<ch.length;i++){
                ch[1].checked=document.getElementById("king");


            }
            ch[0].checked=true;//첫번쨰 체크박스 상태를 체크되어있게..
            ch[1].checked=true;//두번쨰 체크박스 상태를 체크되어있게..
        }
