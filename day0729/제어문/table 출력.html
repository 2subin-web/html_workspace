<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아파트</title>
</head>
<body>

<script>
    let h = Number(prompt("원하시는 호수의 개수를 입력하세요"));
    let f = Number(prompt("원하시는 층수를 입력하세요"));

    document.write("<table border='1' width='100%'>");

    for (let a = 1; a <= f; a++) {
        document.write("<tr>");

        for (let i = 1; i <= h; i++) {
            document.write("<td>" + a + "층 " + i + "호</td>");
        }

        document.write("</tr>");
    }

    document.write("</table>");
</script>

</body>
</html>
