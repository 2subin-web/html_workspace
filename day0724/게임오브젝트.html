<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>게임 화면 구성해보기</title>

    <style>
        body {
            margin: 0;
        }

        .container {
            width: 960px;
            height: 680px;
            background-image: url(../images/desert/BG.png);
            background-size: 960px 680px;
            position: relative;
        }

        #stone {
            width: 50px;
            height: 50px;
            position: absolute;
            left: 400px;
            top: 500px;
        }
    </style>

    <script>
        /*
        지금까지는 태그를 body 태그에 일일이 작성했다면,
        이 예제에서는 태그를 자바스크립트를 이용하여 동적으로
        생성해 보자.
        */
       // document.getElementById()는 기족의 body 안에 어떤 태그요소가
       // 이미 존재할때 접근하는 방법인 반면, createElement()는 프로그래밍
       // 언어로 태그를 생성하는 메서드다.
       document.createElement("img"); // <img> 태그 작성효과를 낸다.
    </script>
</head>

<body>
    <div class="container">
        <!-- 바위 등장시키기 -->

        <!--
        <img
            src="../images/desert/objects/StoneBlock.png"
            alt="바위 이미지"
            id="stone"
        >
        -->
    </div>
</body>
</html>
