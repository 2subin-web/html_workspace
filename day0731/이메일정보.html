<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function showServer(obj){
            console.log(obj);
            // div의 텍스르를 유저가 선택한 서버 주소로 바꾸기
        let content = document. getElementById("content)");
            //obj는 select 박스 자체를 의미하고, 그 select 박스에서 
            //유저가 선택한 값은 value로 접근
            content.innerText=obj.value;
        }
    </script>
</head>
<body>
    <select name="" onchange="showServer(this)">
        <option value="google.com">구글</option>
        <option value="naver.com">네이버</option>
        <option value="daum.net">다음</option>
    </select>

    <div id="content">유저가 선택한 이메일</div>
</body>
</html>
